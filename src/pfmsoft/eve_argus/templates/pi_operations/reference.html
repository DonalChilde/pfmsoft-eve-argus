{% macro reference(title, page, content) %}
<div class="shell">
  <header>
    <div class="topline">
      <div class="brand">ARGUS / PLANETARY OPERATIONS</div>
      <span class="mock-badge">Offline reference</span>
    </div>
    <nav class="nav" aria-label="Planetary Interaction views">
      <a href="?page=extraction">Extraction</a>
      <a href="?page=factory">P1 Inputs</a>
      <a href="?page=factory&amp;view=p2">P2 Inputs</a>
      <a href="?page=factory&amp;view=p3">P3 Inputs</a>
      <a href="?page=buy-build">P4 Buy/Build</a>
      <a href="?page=calculated-costs">Calculated Costs</a>
      <a href="?page=exported-costs">Exported Costs</a>
      <a href="?page=planner">Factory Planner</a>
      <a href="?page=market">Market Prices</a>
      <a href="?page=market&amp;view=history">Market History</a>
      <a href="?page=pi-stats"{% if page == "pi-stats" %} aria-current="page"{% endif %}>PI Stats</a>
      <a href="?page=factory-plans"{% if page == "factory-plans" %} aria-current="page"{% endif %}>Factory Plans</a>
    </nav>
  </header>
  <main>
    <div class="page-heading"><h1>{{ title }}</h1></div>
    <article class="panel pi-reference" aria-label="{{ title }} reference" tabindex="0">
      {{ content }}
    </article>
  </main>
</div>
{% endmacro %}
